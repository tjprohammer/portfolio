name: Deploy portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-portfolio
  cancel-in-progress: true

permissions:
  contents: read

env:
  AWS_REGION: us-west-2
  S3_BUCKET: portfolio.tjprohammer.us
  SITE_DOMAIN: portfolio.tjprohammer.us

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Secrets live on this GitHub Environment (Settings → Environments).
    # Inside it, secret NAMES must be AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY.
    environment: AWS_ACCESS_KEY_ID
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Add CloudFront SPA fallback
        run: cp build/index.html build/404.html

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3
        run: |
          # Long cache for hashed static assets (same pattern as tjprohammer-us)
          aws s3 sync build/ "s3://${S3_BUCKET}/" \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" \
            --exclude "*.json" \
            --exclude "robots.txt" \
            --exclude "sitemap.xml"

          # Short cache for HTML / SEO files
          aws s3 sync build/ "s3://${S3_BUCKET}/" \
            --delete \
            --cache-control "public, max-age=0, must-revalidate" \
            --exclude "*" \
            --include "*.html" \
            --include "*.json" \
            --include "robots.txt" \
            --include "sitemap.xml"

      - name: Invalidate CloudFront
        env:
          DISTRIBUTION_ID: ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          if [ -n "$DISTRIBUTION_ID" ]; then
            DIST_ID="$DISTRIBUTION_ID"
          else
            DIST_ID="$(aws cloudfront list-distributions \
              --query "DistributionList.Items[?Aliases.Items!=null && contains(Aliases.Items, '${SITE_DOMAIN}')].Id | [0]" \
              --output text)"
          fi

          if [ -z "$DIST_ID" ] || [ "$DIST_ID" = "None" ]; then
            echo "Could not resolve CloudFront distribution for ${SITE_DOMAIN}"
            exit 1
          fi

          echo "Invalidating distribution ${DIST_ID}"
          aws cloudfront create-invalidation \
            --distribution-id "$DIST_ID" \
            --paths "/*"
